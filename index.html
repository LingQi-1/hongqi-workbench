<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#C8102E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>我的红旗</title>
  <!-- 强制版本检测 + 一键更新：每次加载都 no-store 拉最新版本号，落后即弹更新条；点击自动注销旧 SW + 清缓存 + 硬刷新，根治“推了但手机看不到” -->
  <script>
  (function () {
    var BUILD = '2.0.13';
    try { localStorage.setItem('hongqi_build', BUILD); } catch (e) {}
    function showUpdateBar(newVer) {
      function render() {
        if (document.getElementById('hongqi-update-bar')) return;
        var bar = document.createElement('div');
        bar.id = 'hongqi-update-bar';
        bar.textContent = '🆕 发现新版本 ' + newVer + '，点击更新';
        bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#C8102E;color:#fff;text-align:center;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)';
        bar.addEventListener('click', function () {
          try {
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); });
            }
            if (window.caches) {
              caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
            }
          } catch (e) {}
          location.reload(true);
        });
        (document.body || document.documentElement).appendChild(bar);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
      else render();
    }
    // 1) 版本清单检测（no-store 拉最新，绕过一切缓存层）
    try {
      fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.version && d.version !== BUILD) showUpdateBar(d.version); })
        .catch(function () {});
    } catch (e) {}
    // 2) SW 自动更新：发现新 SW 立即激活并刷新
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          if (!reg) return;
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage({ type: 'SKIP_WAITING' });
            });
          });
          reg.update().catch(function () {});
        }).catch(function () {});
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloaded) return; reloaded = true; location.reload();
        });
      });
    }
  })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand-dot"></span>
        <span id="topTitle">加油记录</span>
        <span id="carChip" class="car-chip">我的红旗</span>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab active" data-tab="fuel">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V12l4-8h10l4 8v10"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/><path d="M5 14h14"/></svg><span class="tab-tx">加油</span>
      </button>
      <button class="tab" data-tab="price">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg><span class="tab-tx">油价</span>
      </button>
      <button class="tab" data-tab="report">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg><span class="tab-tx">报表</span>
      </button>
      <button class="tab" data-tab="maintenance">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 005.4-5.4l-2.6 2.6-2-2 2.6-2.6z"/></svg><span class="tab-tx">保养</span>
      </button>
      <button class="tab" data-tab="me">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg><span class="tab-tx">我的</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet-mask" hidden>
    <div class="sheet">
      <div class="sheet-head"><span id="sheetTitle">标题</span><button id="sheetClose" class="sheet-close">&times;</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/cars.js"></script>
  <script src="js/fuel.js"></script>
  <script src="js/price.js"></script>
  <script src="js/report.js"></script>
  <script src="js/maintenance.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
